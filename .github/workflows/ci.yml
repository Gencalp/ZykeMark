name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ZykeMark.sln

      - name: Build
        run: dotnet build ZykeMark.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ZykeMark.sln --configuration Release --no-build --logger "console;verbosity=normal"
